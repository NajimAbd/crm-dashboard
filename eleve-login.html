<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Académie — Connexion élève</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0D1A12;
    --green-mid: #16261A;
    --gold: #B8965A;
    --gold-light: #D4AF7A;
    --cream: #F4ECE0;
    --text-soft: #9CA89E;
    --error: #E0685A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--green-mid) 0%, var(--green-deep) 55%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(184,150,90,0.3);
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 32px;
    text-align: center;
    margin: 0 0 28px;
    color: var(--cream);
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1px solid rgba(184,150,90,0.35);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 18px;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(135deg,#C9A86A 0%,#B8965A 100%);
    color: var(--green-deep);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: opacity .15s ease;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg {
    margin-top: 16px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .msg.error { color: var(--error); display: block; }
  .totp-row { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Académie</div>
  <h1>Espace élève</h1>

  <form id="loginForm">
    <label for="login">E-mail</label>
    <input type="email" id="login" autocomplete="username" required>

    <label for="password">Mot de passe</label>
    <div style="position:relative">
      <input type="password" id="password" autocomplete="current-password" required style="padding-right:44px">
      <button type="button" id="togglePwd" aria-label="Afficher le mot de passe" style="position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;padding:0;background:transparent;border:none;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="totp-row" id="totpRow">
      <label for="totpCode">Code de sécurité (2FA)</label>
      <input type="text" id="totpCode" inputmode="numeric" maxlength="6" placeholder="123456">
    </div>

    <button type="submit" id="submitBtn">Se connecter</button>
    <div class="msg error" id="errorMsg"></div>
  </form>
</div>

<script>
  const LOGIN_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-login';
  const SESSION_KEY = 'eleve_session';

  document.getElementById('togglePwd').addEventListener('click', function() {
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion…';

    const login = document.getElementById('login').value.trim();
    const password = document.getElementById('password').value;
    const totpCode = document.getElementById('totpCode').value.trim();

    try {
      const resp = await fetch(LOGIN_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password, totp_code: totpCode || null })
      });
      const data = await resp.json();

      if (data.totp_required) {
        document.getElementById('totpRow').style.display = 'block';
        errEl.textContent = 'Entre le code affiché dans ton application d\'authentification.';
        errEl.className = 'msg error';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
        return;
      }

      if (data.success) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          etudiant_id: data.etudiant_id,
          account_id: data.account_id,
          niveau_id: data.niveau_id,
          nom: data.nom,
          prenom: data.prenom,
          login: login,
          totp_enabled: data.totp_enabled
        }));
        window.location.href = 'eleve-espace.html';
      } else {
        errEl.textContent = data.message || 'E-mail ou mot de passe incorrect.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    } catch (err) {
      errEl.textContent = 'Erreur de connexion. Réessaie.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  });
</script>

</body>
</html>
