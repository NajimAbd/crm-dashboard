<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Académie — Mot de passe oublié</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0D1A12;
    --green-mid: #16261A;
    --gold: #B8965A;
    --cream: #F4ECE0;
    --text-soft: #9CA89E;
    --error: #E0685A;
    --ok: #7FBF8F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--green-mid) 0%, var(--green-deep) 55%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(184,150,90,0.3);
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    text-align: center;
    margin: 0 0 12px;
    color: var(--cream);
  }
  .intro { font-size: 13px; color: var(--text-soft); text-align: center; margin-bottom: 24px; line-height: 1.6; }
  label { display: block; font-size: 12.5px; color: var(--text-soft); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1px solid rgba(184,150,90,0.35);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(135deg,#C9A86A 0%,#B8965A 100%);
    color: var(--green-deep);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 16px; font-size: 13px; text-align: center; display: none; }
  .msg.error { color: var(--error); display: block; }
  .msg.ok { color: var(--ok); display: block; }
  .back-link { display: block; text-align: center; margin-top: 18px; font-size: 12.5px; color: var(--text-soft); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Académie</div>
  <h1>Mot de passe oublié</h1>

  <div id="stepEmail">
    <div class="intro">Entre ton e-mail, on t'envoie un code pour réinitialiser ton mot de passe.</div>
    <form id="requestForm">
      <label for="login">E-mail</label>
      <input type="email" id="login" autocomplete="username" required>
      <button type="submit" id="requestBtn">Recevoir mon code</button>
      <div class="msg" id="requestMsg"></div>
    </form>
  </div>

  <div id="stepCode" style="display:none">
    <div class="intro">Un code a été envoyé à ton e-mail. Entre-le ci-dessous avec ton nouveau mot de passe.</div>
    <form id="resetForm">
      <label for="code">Code reçu par e-mail</label>
      <input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456" required>
      <label for="newPassword">Nouveau mot de passe</label>
      <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
      <button type="submit" id="resetBtn">Réinitialiser mon mot de passe</button>
      <div class="msg" id="resetMsg"></div>
    </form>
  </div>

  <a href="eleve-login.html" class="back-link">← Retour à la connexion</a>
</div>

<script>
  const REQUEST_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-request-reset-code';
  const RESET_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-reset-password';
  let savedLogin = '';

  document.getElementById('requestForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('requestBtn');
    const msgEl = document.getElementById('requestMsg');
    msgEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Envoi…';

    savedLogin = document.getElementById('login').value.trim();

    try {
      await fetch(REQUEST_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: savedLogin })
      });
      document.getElementById('stepEmail').style.display = 'none';
      document.getElementById('stepCode').style.display = 'block';
    } catch (err) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Erreur de connexion. Réessaie.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Recevoir mon code';
    }
  });

  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('resetBtn');
    const msgEl = document.getElementById('resetMsg');
    msgEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Vérification…';

    const code = document.getElementById('code').value.trim();
    const new_password = document.getElementById('newPassword').value;

    try {
      const resp = await fetch(RESET_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: savedLogin, code, new_password })
      });
      const data = await resp.json();
      if (data.success) {
        msgEl.className = 'msg ok';
        msgEl.textContent = 'Mot de passe réinitialisé ! Redirection…';
        msgEl.style.display = 'block';
        setTimeout(() => window.location.href = 'eleve-login.html', 1200);
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = data.message || 'Code incorrect.';
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Réinitialiser mon mot de passe';
      }
    } catch (err) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Erreur de connexion.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Réinitialiser mon mot de passe';
    }
  });
</script>

</body>
</html>
