<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Académie — Activer la 2FA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0D1A12;
    --gold: #B8965A;
    --cream: #F4ECE0;
    --bg-soft: #FAF7F1;
    --text-main: #2C2C2A;
    --text-soft: #6B6B68;
    --border-soft: #E5DECF;
    --error: #C4604E;
    --ok: #5A8C5A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-soft);
    font-family: 'Inter', sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 18px;
    color: var(--green-deep);
  }
  p { font-size: 13.5px; color: var(--text-soft); line-height: 1.6; }
  .qr-box { margin: 18px 0; }
  .qr-box img { border: 1px solid var(--border-soft); border-radius: 10px; }
  .secret-box {
    background: #FAF3E5;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 13px;
    word-break: break-all;
    margin-bottom: 18px;
  }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 1px solid var(--border-soft);
    font-size: 18px;
    text-align: center;
    letter-spacing: 4px;
    margin-bottom: 14px;
    font-family: 'Inter', sans-serif;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(135deg,#C9A86A 0%,#B8965A 100%);
    color: var(--green-deep);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 14px; font-size: 13px; display: none; }
  .msg.error { color: var(--error); display: block; }
  .msg.ok { color: var(--ok); display: block; }
  .back-link { display: inline-block; margin-top: 18px; font-size: 12.5px; color: var(--text-soft); text-decoration: none; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Académie</div>
  <h1>Double authentification</h1>

  <div id="stepLoading"><p>Préparation…</p></div>

  <div id="stepQr" style="display:none">
    <p>Scanne ce QR code avec ton application d'authentification (Google Authenticator, Authy…), puis entre le code à 6 chiffres qu'elle affiche.</p>
    <div class="qr-box"><img id="qrImg" src="" alt="QR code 2FA" width="200" height="200"></div>
    <div class="secret-box" id="secretBox"></div>
    <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="123456">
    <button id="confirmBtn">Activer la 2FA</button>
    <div class="msg" id="stepMsg"></div>
  </div>

  <div id="stepAlready" style="display:none">
    <p>La double authentification est déjà activée sur ton compte.</p>
  </div>

  <a href="eleve-espace.html" class="back-link">← Retour à mon espace</a>
</div>

<script>
  const SESSION_KEY = 'eleve_session';
  const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (!session) window.location.href = 'eleve-login.html';

  const SETUP_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-2fa-setup';
  const CONFIRM_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-2fa-confirm';

  async function init() {
    try {
      const resp = await fetch(SETUP_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: session.login || session.nom })
      });
      const data = await resp.json();
      document.getElementById('stepLoading').style.display = 'none';

      if (data.already_enabled) {
        document.getElementById('stepAlready').style.display = 'block';
        return;
      }
      if (!data.success && !data.secret) {
        document.getElementById('stepAlready').innerHTML = '<p>' + (data.message || 'Une erreur est survenue.') + '</p>';
        document.getElementById('stepAlready').style.display = 'block';
        return;
      }

      document.getElementById('qrImg').src = data.qr_url;
      document.getElementById('secretBox').textContent = data.secret;
      document.getElementById('stepQr').style.display = 'block';
    } catch (e) {
      document.getElementById('stepLoading').innerHTML = '<p>Erreur de connexion. Recharge la page.</p>';
    }
  }

  document.getElementById('confirmBtn').addEventListener('click', async function() {
    const btn = this;
    const msgEl = document.getElementById('stepMsg');
    const code = document.getElementById('codeInput').value.trim();
    btn.disabled = true;
    btn.textContent = 'Vérification…';

    try {
      const resp = await fetch(CONFIRM_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: session.login || session.nom, code })
      });
      const data = await resp.json();
      if (data.success) {
        msgEl.className = 'msg ok';
        msgEl.textContent = 'Activée avec succès ! Redirection…';
        msgEl.style.display = 'block';
        session.totp_enabled = true;
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        setTimeout(() => window.location.href = 'eleve-espace.html', 1200);
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = data.message || 'Code incorrect.';
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Activer la 2FA';
      }
    } catch (e) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Erreur de connexion.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Activer la 2FA';
    }
  });

  init();
</script>

</body>
</html>
