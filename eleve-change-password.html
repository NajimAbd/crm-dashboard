<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Académie — Changer mon mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #0D1A12;
    --green-mid: #16261A;
    --gold: #B8965A;
    --cream: #F4ECE0;
    --text-soft: #9CA89E;
    --error: #E0685A;
    --ok: #7FBF8F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, var(--green-mid) 0%, var(--green-deep) 55%);
    font-family: 'Inter', sans-serif;
    color: var(--cream);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(184,150,90,0.3);
    border-radius: 18px;
    padding: 40px 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    text-align: center;
    margin-bottom: 8px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 28px;
    text-align: center;
    margin: 0 0 12px;
    color: var(--cream);
  }
  .intro { font-size: 13px; color: var(--text-soft); text-align: center; margin-bottom: 26px; line-height: 1.6; }
  label { display: block; font-size: 12.5px; color: var(--text-soft); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1px solid rgba(184,150,90,0.35);
    background: rgba(255,255,255,0.04);
    color: var(--cream);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: none;
    background: linear-gradient(135deg,#C9A86A 0%,#B8965A 100%);
    color: var(--green-deep);
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 16px; font-size: 13px; text-align: center; display: none; }
  .msg.error { color: var(--error); display: block; }
  .msg.ok { color: var(--ok); display: block; }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Académie</div>
  <h1>Choisis ton mot de passe</h1>
  <div class="intro">Pour ta sécurité, tu dois définir un nouveau mot de passe avant d'accéder à ton espace.</div>

  <form id="changeForm">
    <label for="newPassword">Nouveau mot de passe</label>
    <div style="position:relative">
      <input type="password" id="newPassword" autocomplete="new-password" minlength="8" required style="padding-right:44px">
      <button type="button" class="toggle-pwd" data-target="newPassword" aria-label="Afficher le mot de passe" style="position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;padding:0;background:transparent;border:none;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <label for="confirmPassword">Confirme le mot de passe</label>
    <div style="position:relative">
      <input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required style="padding-right:44px">
      <button type="button" class="toggle-pwd" data-target="confirmPassword" aria-label="Afficher le mot de passe" style="position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;padding:0;background:transparent;border:none;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button type="submit" id="submitBtn">Valider</button>
    <div class="msg" id="msgEl"></div>
  </form>
</div>

<script>
  const SESSION_KEY = 'eleve_session';
  const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (!session) window.location.href = 'eleve-login.html';

  const CHANGE_WEBHOOK = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-eleve-change-password';

  document.querySelectorAll('.toggle-pwd').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const input = document.getElementById(btn.getAttribute('data-target'));
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  document.getElementById('changeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msgEl = document.getElementById('msgEl');
    msgEl.style.display = 'none';

    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;

    if (p1 !== p2) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Les deux mots de passe ne correspondent pas.';
      msgEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    try {
      const resp = await fetch(CHANGE_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: session.login, new_password: p1 })
      });
      const data = await resp.json();
      if (data.success) {
        msgEl.className = 'msg ok';
        msgEl.textContent = 'Mot de passe mis à jour ! Redirection…';
        msgEl.style.display = 'block';
        session.must_change_password = false;
        localStorage.setItem(SESSION_KEY, JSON.stringify(session));
        setTimeout(() => window.location.href = 'eleve-espace.html', 1000);
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = data.message || 'Une erreur est survenue.';
        msgEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Valider';
      }
    } catch (err) {
      msgEl.className = 'msg error';
      msgEl.textContent = 'Erreur de connexion.';
      msgEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Valider';
    }
  });
</script>

</body>
</html>
