<!DOCTYPE html>
<html lang="fr">
<head>
<script src="session-securite.js?v=20260924"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Test — à effacer dans le futur</title>
<style>
  :root {
    --paper: #faf6ef;
    --paper-2: #f1ebdd;
    --ink: #2b2618;
    --line: #e2d8c0;
    --gold: #8b6914;

    --vip-bg: #f5e6b3; --vip-fg: #8b6914;
    --midi-bg: #fde2d0; --midi-fg: #c25a1e;
    --h10-bg: #dcefee; --h10-fg: #1f6f72;
    --h5-bg: #e2e0f5; --h5-fg: #4a3f8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 1500px; margin: 0 auto; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
    color: var(--gold); text-decoration: none; font-size: 0.9rem; font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }
  h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 6px; }
  .sub { color: #756a4c; margin: 0 0 28px; font-size: 0.95rem; }

  .stats { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; min-width: 110px;
    cursor: pointer; user-select: none; transition: border-color .15s, box-shadow .15s;
  }
  .stat:hover { border-color: var(--gold); }
  .stat.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(139,105,20,0.25); }
  .stat.stat-tous { background: var(--paper-2); }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: 0.78rem; color: #756a4c; text-transform: uppercase; letter-spacing: 0.03em; }

  .table-scroll { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--paper-2); text-align: left; padding: 10px 12px;
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; color: #756a4c;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  thead tr.phase-row th {
    background: #eadfc2; color: #6b5a2e; font-weight: 700; text-align: center;
    font-size: 0.68rem; padding: 6px 8px;
  }
  thead th.center, tbody td.center { text-align: center; }
  /* Lampes : cacher / montrer une phase (25.09.2026) */
  .lampe {
    display: inline-flex; align-items: center; justify-content: center; vertical-align: middle;
    width: 22px; height: 22px; margin-left: 6px; padding: 0; border: none; border-radius: 50%;
    background: transparent; cursor: pointer; transition: background .15s, transform .15s;
  }
  .lampe:hover { background: rgba(107, 90, 46, 0.12); transform: scale(1.1); }
  .lampe svg { display: block; }
  .lampe .ampoule { fill: #F2C94C; stroke: #8B6E3A; }
  .lampe .rayons { stroke: #E0A800; }
  .lampe.eteinte .ampoule { fill: #ffffff; stroke: #9a9180; }
  .lampe.eteinte .rayons { display: none; }
  thead tr.phase-row th.phase-fermee { background: #efe8d6; color: #9a9180; cursor: pointer; }
  .plie { display: none; min-width: 34px; width: 34px; padding: 0 !important;
    background: repeating-linear-gradient(135deg, #faf6ec, #faf6ec 6px, #f1eadb 6px, #f1eadb 12px); }
  .plie-lbl { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.66rem; letter-spacing: 0.08em; color: #9a9180; display: inline-block; padding: 6px 0; }
  table.ferme-avant .ph-avant, table.ferme-durant .ph-durant, table.ferme-apres .ph-apres, table.ferme-suivi .ph-suivi { display: none; }
  table.ferme-avant .plie-avant, table.ferme-durant .plie-durant, table.ferme-apres .plie-apres, table.ferme-suivi .plie-suivi { display: table-cell; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 0.9rem; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 0.82rem; font-weight: 600; white-space: nowrap;
  }
  .badge-vip { background: var(--vip-bg); color: var(--vip-fg); }
  .badge-midi { background: var(--midi-bg); color: var(--midi-fg); }
  .badge-10h { background: var(--h10-bg); color: var(--h10-fg); }
  .badge-5h { background: var(--h5-bg); color: var(--h5-fg); }

  .jour-pt { font-weight: 600; }
  .jour-oui { color: #2f7d4f; }
  .jour-non { color: #b04a3f; }
  .jour-cell { font-size: 0.85rem; min-width: 80px; }
  .jour-mails { display: flex; justify-content: center; gap: 6px; }
  .jour-mail { display: inline-flex; flex-direction: column; align-items: center; min-width: 26px; }
  .jour-mail-ico { min-height: 20px; display: inline-flex; align-items: center; }
  .jour-mail-lbl { font-size: 0.66rem; color: #9a8f6e; margin-top: 1px; }
  .jour-presence { margin-top: 4px; }
  .non-prevu { color: #c9c0aa; font-size: 1.1rem; font-weight: 600; cursor: help; }
  .pres { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .pres-direct { background: #dcf3e1; color: #1f6b35; }
  .pres-replay { background: #dde9f7; color: #2a5a8c; }
  .th-inter { white-space: normal !important; max-width: 90px; line-height: 1.25; background: #f7eed6 !important; }
  .th-ico { display: block; margin: 0 auto 3px; width: 18px; height: 18px; }
  .inter-cell { background: #fdf9ef; }
  .inter-cell svg { display: block; margin: 0 auto; }
  .inter-info { display: block; font-size: 0.66rem; color: #2f7d4f; margin-top: 2px; }
  .jour-emails { display: block; margin-top: 3px; font-size: 0.7rem; color: #9a8f6e; }
  .jour-emails.complet { color: #2f7d4f; font-weight: 600; }

  .mail-icon { display: inline-flex; vertical-align: middle; }
  .mail-oui { color: #2f7d4f; }
  .mail-non { color: #c9c0aa; }

  .total-pt { font-weight: 700; font-size: 1.05rem; }

  .legende { margin: -14px 0 18px; font-size: 0.82rem; color: #756a4c; }
  .leg-ligne { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  .leg-ligne > span { display: inline-flex; align-items: center; gap: 6px; }
  .leg-aide { margin-top: 10px; }
  .leg-aide summary { cursor: pointer; color: var(--gold); font-weight: 600; }
  .leg-exemple { display: flex; gap: 22px; align-items: flex-start; margin-top: 10px; padding: 12px 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; max-width: 900px; }
  .leg-case { flex: none; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; }
  .leg-exemple ol { margin: 0; padding-left: 18px; line-height: 1.5; color: var(--ink); }
  .leg-resume { margin: 8px 0 0; font-style: italic; }
  .ancien { display: inline-block; margin-left: 6px; font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: #f1ebdd; color: #6b5a2e; border: 1px solid #e2d8c0; vertical-align: middle; }
  .invites { margin-top: 30px; }
  .invites h2 { font-size: 1.15rem; margin: 0 0 4px; }
  .invites .sub { margin-bottom: 12px; }
  .loading, .error { padding: 40px; text-align: center; color: #756a4c; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="webinars.html">← Retour aux Shows</a>
  <a class="back-link" href="emails-modeles.html" style="margin-left:22px">✉️ Modifier les textes des emails</a>
  <h1>Page Test — à effacer dans le futur</h1>
  <p class="sub" id="subtitle">Chargement…</p>
  <div class="legende" id="legende"></div>

  <div id="content"><div class="loading">Chargement des inscrits…</div></div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv936251.hstgr.cloud/webhook/crm-challenge-inscrits";

  const params = new URLSearchParams(window.location.search);
  const siteId = params.get("site_id") || "8";

  const badgeClass = { "VIP": "badge-vip", "Midi": "badge-midi", "10h": "badge-10h", "5h": "badge-5h" };
  const badgeIcon = { "VIP": "🏆", "Midi": "☀️", "10h": "🌤️", "5h": "🌙" };

  let allParticipants = [];
  let allJours = [];
  let heureSoir = '-2h';
  let allDeclencheurs = [];
  let allInvites = null;
  let cinqJours = false; // Challenge 5 jours : Valeur 2 + Témoignages en plus

  // Icones des declencheurs
  const ICO_TEL = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#8b6914"/></svg>`;
  const ICO_SONDAGE = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2.5" width="13" height="17" rx="1.8" fill="#fff" stroke="#8b6914" stroke-width="1.6"/><path d="M6 7h7M6 10.5h7M6 14h4" stroke="#8b6914" stroke-width="1.5" stroke-linecap="round"/><path d="M14.5 20.5l1-3.4 5.3-5.3a1.3 1.3 0 0 1 1.9 1.9l-5.3 5.3z" fill="#8b6914"/></svg>`;
  const ICO_CHAT = `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 17H9l-4.5 3.5V17H4a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 4 4z" fill="#fff" stroke="#8b6914" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="10.5" r="1.2" fill="#8b6914"/><circle cx="12" cy="10.5" r="1.2" fill="#8b6914"/><circle cx="16" cy="10.5" r="1.2" fill="#8b6914"/></svg>`;
  function typeDeclencheur(nom) {
    const n = String(nom).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    if (n.includes('call') || n.includes('appel')) return 'call';
    if (n.includes('sondage')) return 'sondage';
    if (n.includes('chat')) return 'chat';
    return 'autre';
  }
  function enteteDeclencheur(nom) {
    const t = typeDeclencheur(nom);
    if (t === 'call') return `<span class="th-ico">${ICO_TEL}</span>Call`;
    if (t === 'sondage') return `<span class="th-ico">${ICO_SONDAGE}</span>Sondage`;
    if (t === 'chat') return `<span class="th-ico">${ICO_CHAT}</span>Chat`;
    return nom;
  }

  // Case a cocher : cochee (verte) si la personne a fait l'action, vide sinon
  const CASE_OUI = `<svg width="20" height="20" viewBox="0 0 20 20" aria-label="Fait" role="img"><rect x="1" y="1" width="18" height="18" rx="4" fill="#5cb85c"/><path d="M5.2 10.4 L8.4 13.4 L14.8 6.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const CASE_NON = `<svg width="20" height="20" viewBox="0 0 20 20" aria-label="Pas fait" role="img"><rect x="1.5" y="1.5" width="17" height="17" rx="4" fill="#fff" stroke="#cfc5ab" stroke-width="1.5"/></svg>`;

  // Petite enveloppe avec une coche verte = email envoye
  const ENVELOPPE_OK = `<svg width="22" height="18" viewBox="0 0 30 24" aria-label="Email envoyé" role="img">
    <rect x="1" y="3" width="22" height="16" rx="2.5" fill="#fff" stroke="#8b6914" stroke-width="1.6"/>
    <path d="M2 4.5 L12 12 L22 4.5" fill="none" stroke="#8b6914" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="15" y="10" width="14" height="13" rx="3" fill="#5cb85c"/>
    <path d="M18.2 16.6 L21 19.3 L25.8 13.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  // Enveloppe ouverte avec une coche verte = email ouvert par le client
  const ENVELOPPE_OUVERTE = `<svg width="22" height="19" viewBox="0 0 30 26" aria-label="Email ouvert" role="img">
    <path d="M1 11 L12 3 L23 11 V23 a2 2 0 0 1 -2 2 H3 a2 2 0 0 1 -2 -2 Z" fill="#dcf3e1" stroke="#6cc47f" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="5" y="7" width="14" height="9" rx="1" fill="#fff" stroke="#6cc47f" stroke-width="1.1"/>
    <path d="M1.5 11.5 L12 18 L22.5 11.5" fill="none" stroke="#6cc47f" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="15" y="12" width="14" height="13" rx="3" fill="#5cb85c"/>
    <path d="M18.2 18.6 L21 21.3 L25.8 15.9" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  function mailIcon(recu) {
    // Vide tant que l'email n'est pas parti, ✅ une fois envoyé
    if (recu === 'ouvert') return `<span class="mail-icon mail-oui" title="Email ouvert par le client">${ENVELOPPE_OUVERTE}</span>`;
    return recu ? `<span class="mail-icon mail-oui" title="Email envoyé (pas encore ouvert)">${ENVELOPPE_OK}</span>` : '';
  }

  // === Lampes : cacher / montrer les colonnes d'une phase (25.09.2026) ===
  const LAMPE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g class="rayons"><line x1="12" y1="1.5" x2="12" y2="3"/><line x1="4.5" y1="4.5" x2="5.6" y2="5.6"/><line x1="19.5" y1="4.5" x2="18.4" y2="5.6"/><line x1="2" y1="11" x2="3.5" y2="11"/><line x1="20.5" y1="11" x2="22" y2="11"/></g><path class="ampoule" d="M12 5a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V18h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 5z"/><line x1="9.8" y1="20.5" x2="14.2" y2="20.5" stroke="#8B6E3A"/><line x1="10.6" y1="22.5" x2="13.4" y2="22.5" stroke="#8B6E3A"/></svg>';
  let phasesFermees = {};
  try { phasesFermees = JSON.parse(localStorage.getItem('inscrits_phases_fermees') || '{}') || {}; } catch (e) { phasesFermees = {}; }
  function entetePhase(cle, titre, nb) {
    return `<th colspan="${nb}" data-phase="${cle}" data-nb="${nb}" title="Clique sur la lampe pour cacher ou montrer ces colonnes"><span class="phase-titre">${titre}</span><button type="button" class="lampe" onclick="basculerPhase('${cle}')" aria-label="Cacher ou montrer : ${titre}">${LAMPE_SVG}</button></th>`;
  }
  function appliquerPhases() {
    const t = document.getElementById('tableInscrits');
    if (!t) return;
    t.querySelectorAll('thead th[data-phase]').forEach(th => {
      const cle = th.dataset.phase;
      const ferme = !!phasesFermees[cle];
      t.classList.toggle('ferme-' + cle, ferme);
      th.colSpan = ferme ? 1 : Number(th.dataset.nb);
      th.classList.toggle('phase-fermee', ferme);
      th.querySelector('.phase-titre').style.display = ferme ? 'none' : '';
      const b = th.querySelector('.lampe');
      b.classList.toggle('eteinte', ferme);
      b.title = ferme ? 'Lampe éteinte : clique pour montrer les colonnes' : 'Lampe allumée : clique pour cacher les colonnes';
      th.onclick = ferme ? (ev) => { if (!ev.target.closest('.lampe')) basculerPhase(cle); } : null;
    });
  }
  function basculerPhase(cle) {
    phasesFermees[cle] = !phasesFermees[cle];
    try { localStorage.setItem('inscrits_phases_fermees', JSON.stringify(phasesFermees)); } catch (e) {}
    appliquerPhases();
  }

  function renderTable(participants) {
    // Au moins une colonne "Jour 1", meme si les jours du show ne sont pas encore crees
    const nbJours = Math.max(allJours.length, 1);
    const jourLabels = Array.from({ length: nbJours }, (_, idx) => `Jour ${idx + 1}`);
    const headerJours = jourLabels.map(l => `<th class="center ph-durant">${l}</th>`).join("");

    if (participants.length === 0) {
      document.getElementById("content").innerHTML = `<div class="loading">Aucun inscrit pour le moment.</div>${renderInvites()}`;
      return;
    }

    const rows = participants.map(p => {
      const jourCells = (p.jours || []).map(j => {
        // 2 emails du jour : matin (10h) et 2h avant le direct. Case vide tant que rien n'est parti.
        const slot = (etat, label) => `<span class="jour-mail"><span class="jour-mail-ico">${mailIcon(etat)}</span><span class="jour-mail-lbl">${label}</span></span>`;
        const emails = `<div class="jour-mails">${slot(j.email_matin, '10h')}${slot(j.email_soir, heureSoir)}</div>`;
        // Presence : Direct (vert) ou Replay (bleu), avec les points ; vide si absent
        let presence = '';
        if (j.a_regarde) {
          const replay = j.mode === 'replay';
          const detail = j.minutes ? `${j.minutes} min${j.pct ? ' (' + j.pct + '%)' : ''}` : '';
          presence = `<div class="jour-presence" title="${replay ? 'Replay' : 'Direct'}${detail ? ' : ' + detail : ''}"><span class="pres ${replay ? 'pres-replay' : 'pres-direct'}">${replay ? '↻ Replay' : '● Direct'} · ${Number(j.points) || 0} pt</span></div>`;
        }
        return `<td class="center jour-cell ph-durant">${emails}${presence}</td>`;
      }).join("") || '<td class="center jour-cell ph-durant"></td>';
      const interCells = allDeclencheurs.map(nom => {
        const it = (p.interventions || []).find(x => x.nom === nom) || {};
        const jours = (it.jours || []).map(j => 'J' + j).join(' · ');
        const info = it.fait && typeDeclencheur(nom) !== 'call' && jours ? `<span class="inter-info">${jours}</span>` : '';
        const titre = it.fait ? `${nom} : fait${jours ? ' (' + jours + ')' : ''}` : `${nom} : pas encore`;
        return `<td class="center inter-cell ph-durant" title="${titre}">${it.fait ? CASE_OUI : CASE_NON}${info}</td>`;
      }).join("");
      return `
        <tr>
          <td>${p.nom}${p.ancien_lead ? `<span class="ancien" title="Ancien lead invité avec ADD (groupe d'origine : ${p.ancien_lead})">↻ Ancien lead · ${p.ancien_lead}</span>` : ''}</td>
          <td>${p.email}</td>
          <td class="center ph-avant">${mailIcon(p.avant.confirmation)}</td>
          <td class="center ph-avant">${mailIcon(p.avant.valeur)}</td>
          ${cinqJours ? `<td class="center ph-avant">${mailIcon(p.avant.valeur2)}</td>` : ''}
          <td class="center ph-avant">${mailIcon(p.avant.relance_j2)}</td>
          <td class="center ph-avant">${mailIcon(p.avant.relance_j1)}</td>
          <td class="plie plie-avant"></td>
          ${jourCells}
          ${interCells}
          <td class="plie plie-durant"></td>
          <td class="center ph-apres">${p.apres.replay ? mailIcon(p.apres.replay) : (p.groupe === 'Midi' ? '<span class="non-prevu" title="Groupe Midi : pas de replay (a assisté en direct)">–</span>' : '')}</td>
          <td class="center jour-cell ph-apres"><div class="jour-mails"><span class="jour-mail"><span class="jour-mail-ico">${mailIcon(p.apres.qr)}</span><span class="jour-mail-lbl">10h</span></span><span class="jour-mail"><span class="jour-mail-ico">${mailIcon(p.apres.qr_soir)}</span><span class="jour-mail-lbl">${heureSoir}</span></span></div></td>
          ${cinqJours ? `<td class="center ph-apres">${mailIcon(p.apres.temoignages)}</td>` : ''}
          <td class="center ph-apres">${mailIcon(p.apres.cloture)}</td>
          <td class="plie plie-apres"></td>
          <td class="center ph-suivi">${p.suivi.suivi1 ? mailIcon(p.suivi.suivi1) : (p.groupe === 'VIP' ? '<span class="non-prevu" title="A acheté : pas de suivi">–</span>' : '')}</td>
          <td class="center ph-suivi">${p.suivi.suivi2 ? mailIcon(p.suivi.suivi2) : (p.groupe === 'VIP' ? '<span class="non-prevu" title="A acheté : pas de suivi">–</span>' : '')}</td>
          <td class="plie plie-suivi"></td>
          <td class="center total-pt">${Number(p.total_points) || 0}</td>
          <td><span class="badge ${badgeClass[p.groupe] || ''}">${badgeIcon[p.groupe] || ''} ${p.groupe}</span></td>
        </tr>
      `;
    }).join("");

    document.getElementById("content").innerHTML = `
      <div class="table-scroll">
      <table id="tableInscrits">
        <thead>
          <tr class="phase-row">
            <th colspan="2"></th>
            ${entetePhase('avant', 'Avant le show', cinqJours ? 5 : 4)}
            ${entetePhase('durant', 'Durant le show', nbJours + allDeclencheurs.length)}
            ${entetePhase('apres', 'Après le show', cinqJours ? 4 : 3)}
            ${entetePhase('suivi', 'Suivi', 2)}
            <th colspan="2"></th>
          </tr>
          <tr>
            <th>Nom</th><th>Email</th>
            <th class="center ph-avant">Confirmation</th><th class="center ph-avant">Valeur${cinqJours ? ' 1' : ''}</th>${cinqJours ? '<th class="center ph-avant">Valeur 2</th>' : ''}<th class="center ph-avant" title="Rendez-vous 2 jours avant">Rdv (J-2)</th><th class="center ph-avant" title="Rendez-vous la veille">Rdv (J-1)</th><th class="plie plie-avant" title="Colonnes cachées : clique sur la lampe au-dessus pour les montrer"><span class="plie-lbl">Avant</span></th>
            ${headerJours}
            ${allDeclencheurs.map(n => `<th class="center th-inter ph-durant" title="${n}">${enteteDeclencheur(n)}</th>`).join("")}<th class="plie plie-durant" title="Colonnes cachées : clique sur la lampe au-dessus pour les montrer"><span class="plie-lbl">Durant</span></th>
            ${cinqJours
              ? '<th class="center ph-apres">Replay (J6)</th><th class="center ph-apres">Q&R (J7)</th><th class="center ph-apres">Témoignages (J8)</th><th class="center ph-apres">Clôture (J9)</th>'
              : '<th class="center ph-apres">Replay (J4)</th><th class="center ph-apres">Q&R (J5)</th><th class="center ph-apres">Clôture (J6)</th>'}<th class="plie plie-apres" title="Colonnes cachées : clique sur la lampe au-dessus pour les montrer"><span class="plie-lbl">Après</span></th>
            <th class="center ph-suivi">Suivi 1 (J+20)</th><th class="center ph-suivi">Suivi 2 (J+40)</th><th class="plie plie-suivi" title="Colonnes cachées : clique sur la lampe au-dessus pour les montrer"><span class="plie-lbl">Suivi</span></th>
            <th class="center">Total</th><th>Groupe</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
      ${renderInvites()}
    `;
    appliquerPhases();
  }

  // Anciens leads invites (ADD) qui ne se sont pas encore inscrits
  function renderInvites() {
    const liste = (allInvites && allInvites.en_attente) || [];
    if (!allInvites || !allInvites.total) return '';
    const lignes = liste.map(v => `
      <tr>
        <td>${v.nom || ''}</td>
        <td>${v.email}</td>
        <td><span class="badge ${badgeClass[v.groupe_origine] || ''}">${badgeIcon[v.groupe_origine] || ''} ${v.groupe_origine || ''}</span></td>
        <td class="center">${v.ajoute_le || ''}</td>
        <td class="center">${mailIcon(v.invitation)}</td>
        <td class="center">${mailIcon(v.rappel)}</td>
      </tr>`).join('');
    return `
      <div class="invites">
        <h2>Invités pas encore inscrits (${liste.length})</h2>
        <p class="sub">Anciens leads ajoutés avec ADD. Dès qu'ils s'inscrivent sur la page, ils passent dans le tableau du haut avec le badge « ↻ Ancien lead ». Sinon, ils restent dans leur groupe d'origine.</p>
        ${liste.length ? `<div class="table-scroll"><table>
          <thead><tr><th>Nom</th><th>Email</th><th>Groupe d'origine</th><th class="center">Ajouté le</th><th class="center">Invitation</th><th class="center">Rappel (J-2)</th></tr></thead>
          <tbody>${lignes}</tbody>
        </table></div>` : '<div class="loading">Tous les invités se sont inscrits.</div>'}
      </div>`;
  }

  fetch(`${WEBHOOK_URL}?site_id=${encodeURIComponent(siteId)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        document.getElementById("content").innerHTML = `<div class="error">Erreur : ${data.message || "impossible de charger les inscrits"}</div>`;
        return;
      }
      allJours = data.jours || [];
      allDeclencheurs = data.declencheurs || [];
      allInvites = data.invites || null;
      cinqJours = Number(data.nb_jours) === 5 || (data.jours || []).length === 5;
      if (data.heure_direct) {
        const [h, m] = data.heure_direct.split(':').map(Number);
        const t = h * 60 + m - 120;
        heureSoir = String(Math.floor(t / 60)).padStart(2, '0') + 'h' + (t % 60 ? String(t % 60).padStart(2, '0') : '');
      }
      // On ignore les lignes vides (sans vrai email)
      allParticipants = (data.participants || []).filter(p => p && p.email && p.email !== 'undefined' && String(p.email).includes('@'));
      document.getElementById("subtitle").textContent = `${allParticipants.length} inscrit(s) · ${allJours.length} jour(s) de show` + (allInvites && allInvites.total ? ` · Invités ADD : ${allInvites.total}, dont ${allInvites.inscrits} inscrit(s)` : '');
      document.getElementById("legende").innerHTML = `
        <div class="leg-ligne">
          <span>${ENVELOPPE_OK} Email envoyé (pas encore ouvert)</span>
          <span>${ENVELOPPE_OUVERTE} Email ouvert</span>
          <span><span class="pres pres-direct">● Direct · 5 pt</span> A assisté au direct (au moins 50 %)</span>
          <span><span class="pres pres-replay">↻ Replay · 3 pt</span> A regardé l'enregistrement, ou moins de 50 % du direct</span>
          <span>${CASE_OUI} Action faite (J1, J2… = jour de l'action)</span>
          <span>${CASE_NON} Pas encore fait</span>
          <span><span class="non-prevu">–</span> Non prévu (pas de replay pour Midi, pas de suivi pour un acheteur)</span>
        </div>
        <details class="leg-aide">
          <summary>Comment lire une case « Jour » ?</summary>
          <div class="leg-exemple">
            <div class="leg-case">
              <div class="jour-mails"><span class="jour-mail"><span class="jour-mail-ico">${ENVELOPPE_OK}</span><span class="jour-mail-lbl">10h</span></span><span class="jour-mail"><span class="jour-mail-ico">${ENVELOPPE_OK}</span><span class="jour-mail-lbl">${heureSoir}</span></span></div>
              <div class="jour-presence"><span class="pres pres-replay">↻ Replay · 3 pt</span></div>
            </div>
            <ol>
              <li><b>Les 2 enveloppes</b> : l'email du matin (10h) et l'email envoyé 2 h avant le direct. Dorées et fermées = reçus mais pas ouverts. Vertes et ouvertes = ouverts.</li>
              <li><b>L'étiquette en dessous</b> : la présence ce jour-là. Ici, la personne a manqué le direct mais a regardé le replay : 3 points.</li>
              <li><b>Case vide</b> : rien ne s'est encore passé (email pas encore parti, ou absent).</li>
            </ol>
            <p class="leg-resume">En résumé : « Ce jour-là, la personne a reçu ses 2 emails sans les ouvrir, a manqué le direct, mais a rattrapé en replay. » Profil tiède, groupe 10h, sauf si elle a fait un Call ou un Sondage.</p>
          </div>
        </details>`;
      renderTable(allParticipants);
    })
    .catch(err => {
      document.getElementById("content").innerHTML = `<div class="error">Connexion impossible. Réessayez.</div>`;
    });
</script>
</body>
</html>
