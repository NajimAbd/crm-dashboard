<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Test — à effacer dans le futur</title>
<style>
  :root {
    --paper: #faf6ef;
    --paper-2: #f1ebdd;
    --ink: #2b2618;
    --line: #e2d8c0;
    --gold: #8b6914;

    --vip-bg: #f5e6b3; --vip-fg: #8b6914;
    --midi-bg: #fde2d0; --midi-fg: #c25a1e;
    --h10-bg: #dcefee; --h10-fg: #1f6f72;
    --h5-bg: #e2e0f5; --h5-fg: #4a3f8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
    color: var(--gold); text-decoration: none; font-size: 0.9rem; font-weight: 600;
  }
  .back-link:hover { text-decoration: underline; }
  h1 { font-size: 1.7rem; font-weight: 600; margin: 0 0 6px; }
  .sub { color: #756a4c; margin: 0 0 28px; font-size: 0.95rem; }

  .stats { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; min-width: 110px;
    cursor: pointer; user-select: none; transition: border-color .15s, box-shadow .15s;
  }
  .stat:hover { border-color: var(--gold); }
  .stat.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(139,105,20,0.25); }
  .stat.stat-tous { background: var(--paper-2); }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: 0.78rem; color: #756a4c; text-transform: uppercase; letter-spacing: 0.03em; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  thead th {
    background: var(--paper-2); text-align: left; padding: 12px 14px;
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; color: #756a4c;
    border-bottom: 1px solid var(--line);
  }
  thead th.center, tbody td.center { text-align: center; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
  tbody tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 999px;
    font-size: 0.82rem; font-weight: 600; white-space: nowrap;
  }
  .badge-vip { background: var(--vip-bg); color: var(--vip-fg); }
  .badge-midi { background: var(--midi-bg); color: var(--midi-fg); }
  .badge-10h { background: var(--h10-bg); color: var(--h10-fg); }
  .badge-5h { background: var(--h5-bg); color: var(--h5-fg); }

  .jour-pt { font-weight: 600; }
  .jour-oui { color: #2f7d4f; }
  .jour-non { color: #b04a3f; }
  .jour-cell { font-size: 0.85rem; }

  .total-pt { font-weight: 700; font-size: 1.05rem; }

  .loading, .error { padding: 40px; text-align: center; color: #756a4c; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="webinars.html">← Retour aux Shows</a>
  <h1>Page Test — à effacer dans le futur</h1>
  <p class="sub" id="subtitle">Chargement…</p>

  <div class="stats" id="stats"></div>

  <div id="content"><div class="loading">Chargement des inscrits…</div></div>
</div>

<script>
  const WEBHOOK_URL = "https://n8n.srv936251.hstgr.cloud/webhook/crm-challenge-inscrits";

  const params = new URLSearchParams(window.location.search);
  const siteId = params.get("site_id") || "8";

  const badgeClass = { "VIP": "badge-vip", "Midi": "badge-midi", "10h": "badge-10h", "5h": "badge-5h" };
  const badgeIcon = { "VIP": "🏆", "Midi": "☀️", "10h": "🌤️", "5h": "🌙" };

  let allParticipants = [];
  let allJours = [];
  let activeFilter = null; // null = tous, sinon "VIP"/"Midi"/"10h"/"5h"

  function renderStats(counts) {
    const totalTous = Object.values(counts).reduce((a, b) => a + b, 0);
    const carteTous = `
      <div class="stat stat-tous${activeFilter === null ? ' active' : ''}" onclick="toggleFilter(null)">
        <div class="n">${totalTous}</div>
        <div class="l">📋 Tous</div>
      </div>
    `;
    const cartesGroupes = Object.keys(counts).map(g => `
      <div class="stat${activeFilter === g ? ' active' : ''}" onclick="toggleFilter('${g}')">
        <div class="n">${counts[g]}</div>
        <div class="l">${badgeIcon[g]} ${g}</div>
      </div>
    `).join("");
    document.getElementById("stats").innerHTML = carteTous + cartesGroupes;
  }

  function renderTable(participants) {
    const jourLabels = allJours.map((j, idx) => `Jour ${idx + 1}`);
    const headerJours = jourLabels.map(l => `<th class="center">${l}</th>`).join("");

    if (participants.length === 0) {
      document.getElementById("content").innerHTML = `<div class="loading">Aucun inscrit dans ce groupe.</div>`;
      return;
    }

    const rows = participants.map(p => {
      const jourCells = p.jours.map(j => `
        <td class="center jour-cell">
          <span class="${j.a_regarde ? 'jour-oui' : 'jour-non'}">${j.a_regarde ? '✅' : '❌'}</span>
          <span class="jour-pt">${j.points}pt</span>
        </td>
      `).join("");
      return `
        <tr>
          <td>${p.nom}</td>
          <td>${p.email}</td>
          ${jourCells}
          <td class="center total-pt">${p.total_points}</td>
          <td><span class="badge ${badgeClass[p.groupe] || ''}">${badgeIcon[p.groupe] || ''} ${p.groupe}</span></td>
        </tr>
      `;
    }).join("");

    document.getElementById("content").innerHTML = `
      <table>
        <thead>
          <tr><th>Nom</th><th>Email</th>${headerJours}<th class="center">Total</th><th>Groupe</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function toggleFilter(groupe) {
    activeFilter = (activeFilter === groupe) ? null : groupe;
    const counts = { VIP: 0, Midi: 0, "10h": 0, "5h": 0 };
    allParticipants.forEach(p => { if (counts[p.groupe] !== undefined) counts[p.groupe]++; });
    renderStats(counts);
    const visibles = activeFilter ? allParticipants.filter(p => p.groupe === activeFilter) : allParticipants;
    renderTable(visibles);
  }
  window.toggleFilter = toggleFilter;

  fetch(`${WEBHOOK_URL}?site_id=${encodeURIComponent(siteId)}`)
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        document.getElementById("content").innerHTML = `<div class="error">Erreur : ${data.message || "impossible de charger les inscrits"}</div>`;
        return;
      }
      allJours = data.jours || [];
      allParticipants = data.participants || [];
      document.getElementById("subtitle").textContent = `${allParticipants.length} inscrit(s) · ${allJours.length} jour(s) de show`;

      const counts = { VIP: 0, Midi: 0, "10h": 0, "5h": 0 };
      allParticipants.forEach(p => { if (counts[p.groupe] !== undefined) counts[p.groupe]++; });
      renderStats(counts);
      renderTable(allParticipants);
    })
    .catch(err => {
      document.getElementById("content").innerHTML = `<div class="error">Connexion impossible. Réessayez.</div>`;
    });
</script>
</body>
</html>
