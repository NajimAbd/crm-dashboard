<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa — Calendrier</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --green-deep: #0D1A12;
    --gold: #B8965A;
    --gold-light: #D4AF7A;
    --cream: #F4ECE0;
    --bg-soft: #FAF7F1;
    --text-main: #2C2C2A;
    --text-soft: #6B6B68;
    --border-soft: #E5DECF;
    --status-done: #5A8C5A;
    --status-planned: #4A7BA6;
    --status-cancelled: #C4604E;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-soft); font-family: 'Inter', sans-serif; color: var(--text-main); min-height: 100vh; }

  .topbar { background: var(--green-deep); color: var(--cream); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--gold); }
  .topbar-left { flex: 1; display: flex; align-items: center; gap: 14px; }
  .topbar-center { display: flex; align-items: center; gap: 20px; }
  .brand-mark { width: 34px; height: 34px; }
  .brand-text { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 22px; color: var(--cream); }
  .brand-sub { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
  .topbar-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
  .nav-link { color: var(--gold-light); text-decoration: none; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .nav-link:hover { color: var(--cream); }
  .logout-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(224, 104, 90, 0.12); border: 1px solid rgba(224, 104, 90, 0.35); border-radius: 24px; color: #E0685A; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; }
  .logout-btn:hover { background: rgba(224, 104, 90, 0.22); }

  .page { max-width: 1000px; margin: 0 auto; padding: 36px 32px 60px; }
  .page-header { margin-bottom: 28px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 8px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 36px; margin: 0 0 6px; color: var(--green-deep); }
  .subtitle { color: var(--text-soft); font-size: 14px; }

  .filter-tabs { display: flex; gap: 8px; }
  .filter-tab {
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border-soft); background: white; color: var(--text-soft);
    transition: all 0.15s;
  }
  .filter-tab.active { background: var(--green-deep); color: var(--cream); border-color: var(--green-deep); }

  .day-group { margin-bottom: 28px; }
  .day-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px; font-weight: 600; color: var(--green-deep);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--border-soft);
    display: flex; align-items: center; gap: 10px;
  }
  .day-badge {
    font-size: 11px; background: rgba(184, 150, 90, 0.15); color: #8B6E3A;
    padding: 2px 9px; border-radius: 10px; font-family: 'Inter', sans-serif; font-weight: 600;
  }

  .rdv-card {
    background: white; border: 1px solid var(--border-soft); border-radius: 12px;
    padding: 16px 20px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer; transition: box-shadow 0.15s, transform 0.15s;
  }
  .rdv-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); transform: translateY(-1px); }

  .rdv-time {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-weight: 700; color: var(--green-deep);
    min-width: 60px; text-align: center;
  }
  .rdv-divider { width: 1px; height: 36px; background: var(--border-soft); }
  .rdv-content { flex: 1; }
  .rdv-name { font-weight: 600; font-size: 14px; color: var(--text-main); }
  .rdv-meta { font-size: 12px; color: var(--text-soft); margin-top: 2px; }

  .status-chip { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; position: relative; cursor: help; }
  .status-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    width: 220px;
    background: #1A1F17;
    color: #F5F1E8;
    font-size: 12px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: normal;
    line-height: 1.5;
    padding: 10px 12px;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 50;
    text-align: left;
  }
  .status-tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    right: 14px;
    border: 6px solid transparent;
    border-top-color: #1A1F17;
  }
  .status-chip:hover .status-tooltip { display: block; }
  .status-planifie { background: rgba(74, 123, 166, 0.15); color: var(--status-planned); }
  .status-termine { background: rgba(90, 140, 90, 0.15); color: var(--status-done); }
  .status-annule { background: rgba(196, 96, 78, 0.15); color: var(--status-cancelled); }
  .status-passe { background: rgba(140, 130, 120, 0.15); color: #8C8278; }
  .status-absent { background: rgba(196, 96, 78, 0.15); color: #C4604E; }
  .rdv-cancel-btn { background: none; border: none; color: #C4604E; font-size: 16px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px; margin-left: 8px; opacity: 0.55; }
  .rdv-cancel-btn:hover { opacity: 1; background: rgba(196,96,78,0.1); }

  .empty-state, .loading-state { text-align: center; padding: 80px 24px; color: var(--text-soft); }
  .spinner { width: 28px; height: 28px; border: 2.5px solid var(--border-soft); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .page { padding: 24px 16px 50px; }
    .rdv-time { min-width: 50px; font-size: 18px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="50" rx="46" ry="46" fill="none" stroke="#B8965A" stroke-width="3"/>
      <circle cx="50" cy="50" r="6" fill="#B8965A"/>
      <path d="M50 18 L50 38 M50 62 L50 82 M18 50 L38 50 M62 50 L82 50" stroke="#B8965A" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="brand-text">Nexa</div>
      <div class="brand-sub">Platform CRM</div>
    </div>
  </div>
  <div class="topbar-center">
    <a class="nav-link" onclick="window.location.href='dashboard.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      Tableau de bord
    </a>
    <a class="nav-link" onclick="window.location.href='kpi.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      KPI
    </a>
    <a class="nav-link" onclick="window.location.href='webinars.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Webinaires
    </a>
    <a class="nav-link" onclick="window.location.href='sales.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Mes ventes
    </a>
    <a class="nav-link" onclick="window.location.href='finances.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="12" y2="15"/></svg>
      Finances
    </a>
    <a class="nav-link" onclick="window.location.href='comptabilite-officielle.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6M9 16h6M9 8h6M5 2h14a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/></svg>
      Comptabilité officielle
    </a>
    <a id="adminLink" href="admin.html" style="display:none;align-items:center;gap:6px;color:var(--gold-light,#D4AF7A);text-decoration:none;font-size:13px;cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Panel Admin
    </a>
  </div>
  <div class="topbar-right">
    <button class="logout-btn" onclick="logout()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Déconnexion
    </button>
  </div>
</div>

<div class="page">

  <div class="page-header">
    <div>
      <div class="eyebrow">Planning</div>
      <h1>Mes rendez-vous</h1>
      <div class="subtitle" id="subtitleCount">Chargement…</div>
    </div>
    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all" onclick="setFilter('all')">Tous</div>
      <div class="filter-tab" data-filter="planifie" onclick="setFilter('planifie')">À venir</div>
      <div class="filter-tab" data-filter="passe" onclick="setFilter('passe')">Passés (à mettre à jour)</div>
      <div class="filter-tab" data-filter="absent" onclick="setFilter('absent')">Absents</div>
      <div class="filter-tab" data-filter="termine" onclick="setFilter('termine')">Terminés</div>
    </div>
  </div>

  <div id="rdvContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Chargement du calendrier…</div>
    </div>
  </div>

</div>

<script>
  const CRM_APPOINTMENTS_API = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-appointments';
  const SESSION_KEY = 'crm_session_user';
  const SESSION_EXPIRY = 'crm_session_expiry';

  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      const expiry = parseInt(localStorage.getItem(SESSION_EXPIRY) || '0');
      if (!raw || Date.now() >= expiry) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }
  function logout() {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_EXPIRY);
    window.location.href = 'index.html';
  }

  const session = getSession();
  if (!session) {
    window.location.href = 'index.html';
    throw new Error('No session');
  }
  if (session.role === 'super_admin') {
    const adminLinkEl = document.getElementById('adminLink');
    if (adminLinkEl) adminLinkEl.style.display = 'flex';
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let allAppointments = [];
  let currentFilter = 'all';

  async function loadAppointments() {
    try {
      const resp = await fetch(CRM_APPOINTMENTS_API + '?account_id=' + encodeURIComponent(session.account_id));
      const data = await resp.json();
      allAppointments = data.appointments || [];
      document.getElementById('subtitleCount').textContent = allAppointments.length + ' rendez-vous au total';
      render();
    } catch (err) {
      document.getElementById('rdvContainer').innerHTML = '<div class="empty-state">Impossible de charger le calendrier.</div>';
    }
  }

  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
    render();
  }

  function render() {
    let list = allAppointments;
    if (currentFilter !== 'all') {
      list = list.filter(a => {
        const d = new Date(a.date_rdv.replace(' ', 'T'));
        const isPastDue = (a.statut === 'planifie' || !a.statut) && d < new Date();
        const effectiveStatus = a.statut === 'absent' ? 'absent' : (isPastDue ? 'passe' : (a.statut || 'planifie'));
        return effectiveStatus === currentFilter;
      });
    }

    const container = document.getElementById('rdvContainer');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state">Aucun rendez-vous dans cette catégorie.</div>';
      return;
    }

    // Grouper par jour
    const groups = {};
    list.forEach(a => {
      const d = new Date(a.date_rdv.replace(' ', 'T'));
      const key = d.toLocaleDateString('fr-FR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
      if (!groups[key]) groups[key] = [];
      groups[key].push(a);
    });

    let html = '';
    Object.keys(groups).forEach(dayLabel => {
      const items = groups[dayLabel];
      html += '<div class="day-group">';
      html += '<div class="day-label">' + capitalize(dayLabel) + ' <span class="day-badge">' + items.length + '</span></div>';

      items.forEach(a => {
        const d = new Date(a.date_rdv.replace(' ', 'T'));
        const time = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        const fullName = ((a.prenom || '') + ' ' + (a.nom || '')).trim() || 'Lead sans nom';
        const isPastDue = (a.statut === 'planifie' || !a.statut) && d < new Date();
        const effectiveStatus = a.statut === 'absent' ? 'absent' : (isPastDue ? 'passe' : (a.statut || 'planifie'));
        const statusClass = 'status-' + effectiveStatus;
        const statusLabel = a.statut === 'termine' ? 'Terminé' : (a.statut === 'annule' ? 'Annulé' : (a.statut === 'absent' ? 'Absent' : (isPastDue ? 'Passé (à mettre à jour)' : 'Planifié')));
        const showCancelBtn = a.statut !== 'annule' && a.statut !== 'absent';

        const STATUS_TOOLTIPS = {
          'planifie': 'Rendez-vous confirmé et à venir. Rien à faire pour l\'instant — il apparaîtra automatiquement dans "Terminé" ou "Passé" une fois la date dépassée.',
          'termine': 'Le client s\'est présenté et la consultation a eu lieu normalement. Statut mis à jour manuellement par toi.',
          'absent': 'Le client n\'est jamais venu au rendez-vous prévu, sans prévenir à l\'avance (no-show). Utile pour repérer un besoin de rappel automatique ou d\'acompte.',
          'annule': 'Le client a annulé lui-même depuis Calendly avant la date. Détecté et mis à jour automatiquement, rien à faire de ton côté.',
          'passe': 'La date est déjà dépassée mais personne n\'a encore dit ce qui s\'est passé. Clique sur le rendez-vous pour le marquer "Terminé", ou sur la croix rouge pour "Absent".'
        };
        const tooltipText = STATUS_TOOLTIPS[effectiveStatus] || '';

        html += '<div class="rdv-card">' +
          '<div class="rdv-time" onclick="window.location.href=\'lead-detail.html?id=' + a.lead_id + '\'" style="cursor:pointer">' + time + '</div>' +
          '<div class="rdv-divider"></div>' +
          '<div class="rdv-content" onclick="window.location.href=\'lead-detail.html?id=' + a.lead_id + '\'" style="cursor:pointer">' +
            '<div class="rdv-name">' + esc(fullName) + '</div>' +
            '<div class="rdv-meta">' + esc(a.email || '') + (a.whatsapp ? ' · ' + esc(a.whatsapp) : '') + '</div>' +
          '</div>' +
          '<span class="status-chip ' + statusClass + '">' + statusLabel +
            '<span class="status-tooltip">' + esc(tooltipText) + '</span>' +
          '</span>' +
          (showCancelBtn ? '<button class="rdv-cancel-btn" title="Marquer absent (client non présenté)" onclick="event.stopPropagation(); markAbsent(' + a.id + ')">✕</button>' : '') +
        '</div>';
      });

      html += '</div>';
    });

    container.innerHTML = html;
  }

  async function markAbsent(appointmentId) {
    if (!confirm('Marquer ce rendez-vous comme "Absent" (client non présenté) ?')) return;
    try {
      const resp = await fetch('https://n8n.srv936251.hstgr.cloud/webhook/crm-appointment-set-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ appointment_id: appointmentId, statut: 'absent' })
      });
      const data = await resp.json();
      if (data.ok) {
        const a = allAppointments.find(x => x.id === appointmentId);
        if (a) a.statut = 'absent';
        render();
      } else {
        alert('Erreur lors de la mise à jour.');
      }
    } catch (e) {
      alert('Erreur de connexion.');
    }
  }

  function capitalize(s) {
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  loadAppointments();
</script>

</body>
</html>
