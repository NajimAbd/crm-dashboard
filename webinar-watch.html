<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinaire en direct</title>
<style>
  :root { --green-deep:#0D1A12; --gold:#B8965A; --cream:#FAF7F1; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: Arial, sans-serif; background:#fff; }
  .layout { display:flex; height:100vh; width:100vw; }
  .main-col { flex:1; display:flex; flex-direction:column; min-width:0; }
  .video-area { flex:1; position:relative; background:#fff; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; object-fit:contain; background:#fff; }
  .live-badge { position:absolute; top:16px; left:16px; display:inline-flex; align-items:center; gap:6px; background:#c0392b; color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; z-index:5; }
  .live-dot { width:8px; height:8px; background:#fff; border-radius:50%; animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .viewer-count { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; font-weight:600; padding:6px 14px; border-radius:20px; z-index:5; }
  .title-bar { background:var(--green-deep); color:var(--cream); padding:16px 20px; border-top:2px solid var(--gold); }
  .title-bar h1 { margin:0; font-size:17px; font-weight:700; }
  .chat-col { width:340px; background:#161f19; border-left:1px solid #2a352d; display:flex; flex-direction:column; }
  .chat-header { padding:14px 16px; color:var(--cream); font-weight:700; font-size:14px; border-bottom:1px solid #2a352d; }
  .chat-messages { flex:1; overflow-y:auto; padding:10px 14px; }
  .chat-msg { margin-bottom:14px; font-size:13px; line-height:1.4; animation:fadein 0.4s; display:flex; gap:8px; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .chat-avatar { width:28px; height:28px; min-width:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
  .chat-body { flex:1; min-width:0; }
  .chat-line1 { display:flex; align-items:baseline; gap:6px; margin-bottom:2px; }
  .chat-msg .author { color:var(--gold); font-weight:700; }
  .chat-time { color:#6b756e; font-size:10px; }
  .chat-msg .text { color:var(--cream); word-break:break-word; }
  .unmute-btn { position:absolute; bottom:70px; left:50%; transform:translateX(-50%); padding:10px 20px; border:none; border-radius:24px; background:var(--gold); color:var(--green-deep); font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.3); z-index:5; }
  .sound-control { position:absolute; bottom:20px; left:20px; display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.55); padding:8px 14px; border-radius:24px; z-index:5; }
  .mute-toggle-btn { background:none; border:none; font-size:18px; cursor:pointer; padding:0; line-height:1; }
  .volume-slider { width:90px; cursor:pointer; accent-color:var(--gold); }
  .waiting, .ended { background:var(--cream); border-radius:12px; padding:60px 30px; text-align:center; margin:auto; max-width:520px; }
  .waiting h2, .ended h2 { color:var(--green-deep); margin:0 0 18px; font-size:24px; }
  .subtitle-waiting { color:#666; font-size:14px; margin:6px 0; }
  .start-date { color:var(--green-deep); font-size:19px; font-weight:700; margin:8px 0 20px; text-transform:capitalize; }
  .countdown { font-size:32px; font-weight:700; color:var(--gold); margin:8px 0 20px; }
  .tier-badge { display:inline-block; background:rgba(184,150,90,0.15); color:var(--gold); font-weight:700; font-size:14px; padding:8px 18px; border-radius:20px; margin:10px 0 16px; }
  .lobby-msg { text-align:center; color:var(--green-deep); }
  .lobby-msg h2 { font-size:22px; margin:16px 0 8px; }
  .lobby-cd { font-size:40px; font-weight:700; color:var(--gold); }
  .lobby-spinner { width:36px; height:36px; border:4px solid rgba(184,150,90,0.25); border-top-color:var(--gold); border-radius:50%; margin:0 auto; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #presenterPanel { position:fixed; bottom:20px; right:20px; width:280px; background:var(--green-deep); border:1px solid var(--gold); border-radius:12px; z-index:9999; box-shadow:0 8px 30px rgba(0,0,0,0.4); font-size:13px; }
  .pp-header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; color:var(--gold); font-weight:700; font-size:12px; border-bottom:1px solid rgba(184,150,90,0.3); }
  .pp-header button { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:6px; width:22px; height:22px; cursor:pointer; }
  .pp-body { padding:14px; }
  .pp-clock { font-size:32px; font-weight:700; color:var(--cream); text-align:center; }
  .pp-current { color:var(--gold); text-align:center; font-size:12px; margin:6px 0 12px; }
  .pp-controls { display:flex; gap:6px; margin-bottom:12px; }
  .pp-controls button { flex:1; padding:7px 4px; border:none; border-radius:6px; background:var(--gold); color:var(--green-deep); font-weight:700; font-size:11px; cursor:pointer; }
  .pp-list { max-height:180px; overflow-y:auto; }
  .pp-block { display:flex; justify-content:space-between; padding:6px 8px; color:#aab; border-radius:6px; margin-bottom:3px; font-size:11px; align-items:center; gap:4px; }
  .pp-block.active { background:rgba(184,150,90,0.2); color:var(--cream); font-weight:700; }
  .pp-name-input { flex:1; min-width:0; background:rgba(255,255,255,0.06); border:1px solid rgba(184,150,90,0.25); color:var(--cream); border-radius:5px; padding:4px 6px; font-size:11px; }
  .pp-dur-input { width:38px; background:rgba(255,255,255,0.06); border:1px solid rgba(184,150,90,0.25); color:var(--cream); border-radius:5px; padding:4px; font-size:11px; text-align:center; }
  .pp-dur-label { color:#889; font-size:10px; }
  .pp-del-btn { background:none; border:none; color:#c0392b; cursor:pointer; font-size:13px; padding:0 2px; }
  .pp-add-btn { width:100%; margin-top:8px; padding:8px; border:1px dashed var(--gold); background:transparent; color:var(--gold); border-radius:6px; font-size:12px; cursor:pointer; }
  .final-number { font-size:140px; font-weight:900; color:var(--gold); animation:popnum 1s ease; line-height:1; }
  @keyframes popnum { 0%{transform:scale(0.4); opacity:0} 50%{transform:scale(1.15); opacity:1} 100%{transform:scale(1)} }
  .loading { color:var(--cream); text-align:center; margin:auto; }
  @media (max-width:800px) { .layout { flex-direction:column; } .chat-col { width:100%; height:220px; } }
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="loading">Connexion au webinaire…</div>
</div>

<script>
  const CRM_WATCH_API = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-webinar-watch';
  const params = new URLSearchParams(window.location.search);
  const inscriptionId = params.get('id');
  const isPresenterMode = params.get('presenter') === 'najim2026';
  let reportInterval = null;

  const CHAT_PERSONS = [
    '@sarah.b','karim_m92','NadiaT','yassine.k7','@malika_88','omarbenali','amalfr23','@rachid.dz',
    'imane_1990','sofianeK','@sara.belhaj','adil.tanger','HindOu','@bilal_2024','fatima.zh','hassan99',
    '@leila_c','youssef.b','NoraLyon','@karim.essaidi','siham_92','medaminee','@nawal.b','othmane77',
    'aicha_k','@driss.ma','salma2000','ilyas_official','@houda.b','reda_ma','yasmina77','@anass.k',
    'chaimaa_m','hamza.rt','@meriem_z','soufiane99','@nadia.b','karim_lyon','@sofia.m','yanis77',
    '@rania_k','thomas.p','@leila.tanger','@anass_04','sarah_23','@karim.tz','aicha_92','@omar_lille',
    'nesrine.k','@fahd.b','salima77','@yacine.m','imane_23','@driss.tanger','lina.b','@amine_geneve',
    'khadija99','@said.k','houda_paris','@brahim.z','nawel23','@toufik.b','sabrina_m','@walid.k'
  ];

  const CHAT_GENERAL = [
    'Bonsoir tout le monde 👋','coucou de Genève 🇨🇭','Enfin quelqu\'un qui explique clairement 🔥',
    '🔥🔥🔥','C\'est exactement ce que je cherchais','Merci pour ce partage ❤️','Je note tout ça 📝',
    'Wow je n\'y avais jamais pensé comme ça','👏👏👏','Ça confirme ce que je vivais depuis des années',
    'Incroyable, merci beaucoup !','J\'ai déjà commencé à appliquer ça 🔥','Génial cette masterclass 🙏🙏',
    'Je partage à ma sœur tout de suite','💯💯💯','ça change tout ce que je pensais','Merci infiniment 🙏',
    'trop bien expliqué','🔥🔥🔥🔥','je suis scotchée','Enfin une vraie méthode qui marche','👍👍',
    'ça vaut vraiment le detour ce live','j\'attends la suite avec impatience','🙌🙌','top niveau franchement',
    'On sent l\'expérience derrière','exactement mon problème depuis 2 ans','💪💪','clair et net, merci',
    'ça va être top','on est prêts 💪','connectée depuis le Maroc 🇲🇦','la dernière fois c\'était énorme',
    'trop hâte !','de Genève aussi, salut tout le monde 🇨🇭','presque prêt 👀','coucou de Paris 👋'
  ];

  const CHAT_QUESTIONS = [
    'quelqu\'un sait si le replay sera dispo ?',
    'Est-ce que ça marche aussi pour mon cas ?',
    'On peut avoir le lien du bonus ? 🙏',
    'quelqu\'un a le lien du groupe whatsapp ?',
    'ça dure combien de temps en tout ?',
    'y a un support après si on a des questions ?',
    'c\'est adapté aux débutants aussi ?',
    'est-ce qu\'il y aura un Q&A à la fin ?'
  ];

  const CHAT_ANSWERS = [
    'oui je crois','normalement oui !','je pense que oui','regarde plus haut dans le chat 👆',
    'oui exactement, ça marche pour tous les cas','je me demandais la même chose',
    'à confirmer mais je crois que oui','bonne question, hâte de savoir aussi'
  ];

  const AVATAR_COLORS = ['#B8965A','#5A8C5A','#8C5A5A','#5A7A8C','#8C7A5A','#6E5A8C','#5A8C7A','#8C5A7A'];
  let chatEngineStarted = false;
  let pendingQuestion = false;

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function startChatEngine() {
    if (chatEngineStarted) return;
    chatEngineStarted = true;

    function tick() {
      const roll = Math.random();
      let author = pick(CHAT_PERSONS);
      let text;

      if (pendingQuestion && roll < 0.45) {
        text = pick(CHAT_ANSWERS);
        pendingQuestion = false;
      } else if (roll < 0.15) {
        text = pick(CHAT_QUESTIONS);
        pendingQuestion = true;
      } else {
        text = pick(CHAT_GENERAL);
      }

      appendChatMsg({ author, text });
      setTimeout(tick, 3000 + Math.random() * 9000);
    }
    setTimeout(tick, 2000 + Math.random() * 3000);
  }
  function avatarColorFor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  if (!inscriptionId) {
    document.getElementById('layout').innerHTML = '<div class="ended"><h2>Lien invalide.</h2></div>';
  } else {
    loadInfo();
  }

  async function loadInfo() {
    try {
      const resp = await fetch(CRM_WATCH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'info', inscription_id: inscriptionId })
      });
      const data = await resp.json();
      if (!data.success) {
        document.getElementById('layout').innerHTML = '<div class="ended"><h2>' + (data.message || 'Webinaire introuvable.') + '</h2></div>';
        return;
      }
      render(data);
    } catch (err) {
      document.getElementById('layout').innerHTML = '<div class="ended"><h2>Erreur de connexion.</h2></div>';
    }
  }

  const LOBBY_WINDOW = 300;

  function render(data) {
    if (data.statut === 'en_attente') {
      if (data.secondes_avant_debut <= LOBBY_WINDOW) {
        renderLobby(data);
      } else {
        renderWaiting(data);
      }
    } else if (data.statut === 'termine') {
      renderEnded(data);
    } else {
      renderPlayer(data);
    }
  }

  function renderLobby(data) {
    const layout = document.getElementById('layout');
    layout.innerHTML =
      '<div class="main-col">' +
        '<div class="video-area">' +
          '<div class="lobby-msg" id="lobbyMsg">' +
            '<div class="lobby-spinner"></div>' +
            '<h2>On y est presque…</h2>' +
            '<div class="lobby-cd" id="lobbyCd"></div>' +
          '</div>' +
        '</div>' +
        '<div class="title-bar"><h1>' + escHtml(data.titre) + '</h1></div>' +
      '</div>' +
      '<div class="chat-col">' +
        '<div class="chat-header">💬 Discussion en direct</div>' +
        '<div class="chat-messages" id="chatMessages"></div>' +
      '</div>';

    restoreChatHistory();
    startChatEngine();

    let remaining = data.secondes_avant_debut;
    const cdEl = document.getElementById('lobbyCd');
    const lobbyMsgEl = document.getElementById('lobbyMsg');

    function tick() {
      if (remaining <= 0) { loadInfo(); return; }

      if (remaining <= 10) {
        lobbyMsgEl.innerHTML = '<div class="final-number">' + remaining + '</div>';
      } else {
        const m = Math.floor(remaining/60), s = remaining%60;
        cdEl.textContent = (m > 0 ? m + 'min ' : '') + String(s).padStart(2,'0') + 's';
      }
      remaining--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function renderWaiting(data) {
    const secs = data.secondes_avant_debut;
    const startDate = new Date(data.heure_debut.replace(' ', 'T') + 'Z');
    const now = new Date();
    const isSameDay = startDate.getUTCFullYear() === now.getUTCFullYear() && startDate.getUTCMonth() === now.getUTCMonth() && startDate.getUTCDate() === now.getUTCDate();

    let tier;
    if (secs <= 2400) tier = 'urgent';
    else if (isSameDay) tier = 'today';
    else tier = 'far';

    let html = '<div class="waiting">' +
      '<h2>Bienvenue' + (data.nom ? ', ' + escHtml(data.nom.split(' ')[0]) : '') + ' 👋</h2>' +
      '<div class="subtitle-waiting">Ton webinaire "' + escHtml(data.titre) + '" commence le :</div>' +
      '<div class="start-date">' + formatStartDate(data.heure_debut) + '</div>';

    if (tier === 'urgent') {
      html += '<div class="countdown" id="cd"></div>' +
              '<div class="subtitle-waiting">Reste sur cette page, la lecture démarrera automatiquement.</div>';
    } else if (tier === 'today') {
      html += '<div class="tier-badge">📅 Aujourd\'hui, c\'est le grand jour !</div>' +
              '<div class="subtitle-waiting">Reviens sur ce lien à ' + formatTimeOnly(data.heure_debut) + ' pile pour rejoindre le direct.</div>';
    } else {
      html += '<div class="tier-badge">🎉 Ton accès est confirmé</div>' +
              '<div class="subtitle-waiting">Garde bien cette date de côté — on t\'attend ici avec plaisir !</div>';
    }
    html += '</div>';
    document.getElementById('layout').innerHTML = html;

    if (tier !== 'urgent') {
      setTimeout(loadInfo, 60000);
      return;
    }

    let remaining = secs;
    const cdEl = document.getElementById('cd');
    function tick() {
      if (remaining <= 0) { loadInfo(); return; }
      const h = Math.floor(remaining/3600), m = Math.floor((remaining%3600)/60), s = remaining%60;
      let txt = '';
      if (h > 0) txt += h + 'h ';
      txt += String(m).padStart(2,'0') + 'min ' + String(s).padStart(2,'0') + 's';
      cdEl.textContent = txt;
      remaining--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function formatTimeOnly(heureDebutStr) {
    const d = new Date(heureDebutStr.replace(' ', 'T') + 'Z');
    return String(d.getUTCHours()).padStart(2,'0') + 'h' + String(d.getUTCMinutes()).padStart(2,'0');
  }

  function formatStartDate(heureDebutStr) {
    const d = new Date(heureDebutStr.replace(' ', 'T') + 'Z');
    const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const jourNom = jours[d.getUTCDay()];
    const jourNum = d.getUTCDate();
    const moisNom = mois[d.getUTCMonth()];
    const heures = String(d.getUTCHours()).padStart(2,'0');
    const minutes = String(d.getUTCMinutes()).padStart(2,'0');
    return jourNom + ' ' + jourNum + ' ' + moisNom + ' à ' + heures + 'h' + minutes;
  }

  function renderEnded(data) {
    document.getElementById('layout').innerHTML = '<div class="ended"><h2>Ce webinaire est terminé</h2><div>Une nouvelle session commence bientôt — reviens vérifier plus tard.</div></div>';
  }

  function renderPlayer(data) {
    const layout = document.getElementById('layout');
    layout.innerHTML =
      '<div class="main-col">' +
        '<div class="video-area">' +
          '<div class="live-badge"><span class="live-dot"></span> EN DIRECT</div>' +
          '<div class="viewer-count" id="viewerCount">' + (data.spectateurs_actuels || 1) + ' spectateurs</div>' +
          '<video id="videoPlayer" autoplay muted playsinline oncontextmenu="return false" controlsList="nodownload noremoteplayback nofullscreen"></video>' +
          '<div class="sound-control" id="soundControl">' +
            '<button id="muteToggle" class="mute-toggle-btn">🔇</button>' +
            '<input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">' +
          '</div>' +
        '</div>' +
        '<div class="title-bar"><h1>' + escHtml(data.titre) + '</h1></div>' +
      '</div>' +
      '<div class="chat-col">' +
        '<div class="chat-header">💬 Discussion en direct</div>' +
        '<div class="chat-messages" id="chatMessages"></div>' +
      '</div>';

    const video = document.getElementById('videoPlayer');
    video.src = data.video_url;
    video.addEventListener('loadedmetadata', () => {
      video.currentTime = data.position_secondes;
      video.play().catch(() => {});
    });

    const muteToggle = document.getElementById('muteToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    video.volume = 0.8;

    muteToggle.addEventListener('click', function() {
      video.muted = !video.muted;
      muteToggle.textContent = video.muted ? '🔇' : '🔊';
    });

    volumeSlider.addEventListener('input', function() {
      video.volume = this.value / 100;
      if (this.value > 0 && video.muted) { video.muted = false; muteToggle.textContent = '🔊'; }
      if (this.value == 0) { video.muted = true; muteToggle.textContent = '🔇'; }
    });

    restoreChatHistory();
    startChatEngine();
    startViewerCountSimulation();

    if (isPresenterMode) initPresenterPanel();

    reportInterval = setInterval(() => {
      if (!video.paused) {
        fetch(CRM_WATCH_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'progress', inscription_id: inscriptionId, position_secondes: Math.floor(video.currentTime) })
        }).catch(() => {});
      }
    }, 15000);
  }

  function initPresenterPanel() {
    const saved = localStorage.getItem('presenterBlocks');
    let blocks = saved ? JSON.parse(saved) : [
      { name: 'Introduction', dur: 10 },
      { name: 'Argument 1', dur: 20 },
      { name: 'Argument 2', dur: 20 },
      { name: 'Pause', dur: 10 },
      { name: 'Argument 3', dur: 20 },
      { name: 'Argument 4', dur: 20 },
      { name: 'Questions', dur: 15 },
      { name: 'Conclusion', dur: 5 }
    ];

    const panel = document.createElement('div');
    panel.id = 'presenterPanel';
    panel.innerHTML =
      '<div class="pp-header">🎤 Mode présentateur (privé)<button id="ppToggle">—</button></div>' +
      '<div class="pp-body" id="ppBody">' +
        '<div class="pp-clock" id="ppClock">00:00</div>' +
        '<div class="pp-current" id="ppCurrent">—</div>' +
        '<div class="pp-controls">' +
          '<button id="ppStart">▶ Démarrer</button>' +
          '<button id="ppNext">⏭ Suivant</button>' +
          '<button id="ppReset">↺ Reset</button>' +
        '</div>' +
        '<div class="pp-list" id="ppList"></div>' +
        '<button id="ppAdd" class="pp-add-btn">+ Ajouter un bloc</button>' +
      '</div>';
    document.body.appendChild(panel);

    let elapsed = 0, running = false, currentIdx = 0, interval = null;

    function save() { localStorage.setItem('presenterBlocks', JSON.stringify(blocks)); }

    function renderList() {
      const listEl = document.getElementById('ppList');
      listEl.innerHTML = blocks.map((b, i) =>
        '<div class="pp-block" id="ppb-' + i + '">' +
          '<input class="pp-name-input" data-i="' + i + '" value="' + escHtml(b.name) + '">' +
          '<input class="pp-dur-input" type="number" min="1" data-i="' + i + '" value="' + b.dur + '">' +
          '<span class="pp-dur-label">min</span>' +
          '<button class="pp-del-btn" data-i="' + i + '">✕</button>' +
        '</div>'
      ).join('');

      listEl.querySelectorAll('.pp-name-input').forEach(el => {
        el.addEventListener('change', function() { blocks[this.dataset.i].name = this.value; save(); update(); });
      });
      listEl.querySelectorAll('.pp-dur-input').forEach(el => {
        el.addEventListener('change', function() { blocks[this.dataset.i].dur = Math.max(1, parseInt(this.value,10)||1); save(); update(); });
      });
      listEl.querySelectorAll('.pp-del-btn').forEach(el => {
        el.addEventListener('click', function() { blocks.splice(this.dataset.i, 1); save(); renderList(); update(); });
      });
    }

    document.getElementById('ppAdd').addEventListener('click', function() {
      blocks.push({ name: 'Nouveau bloc', dur: 10 });
      save(); renderList(); update();
    });

    function totalBefore(idx) { let t = 0; for (let i=0;i<idx;i++) t += blocks[i].dur*60; return t; }

    function update() {
      const m = Math.floor(elapsed/60), s = elapsed%60;
      document.getElementById('ppClock').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');

      let cum = 0, idx = 0;
      for (let i=0;i<blocks.length;i++) {
        if (elapsed < cum + blocks[i].dur*60) { idx = i; break; }
        cum += blocks[i].dur*60;
        idx = i + 1;
      }
      currentIdx = idx;
      blocks.forEach((b,i) => { const el = document.getElementById('ppb-'+i); if (el) el.classList.toggle('active', i===currentIdx); });

      if (currentIdx >= blocks.length) {
        document.getElementById('ppCurrent').textContent = 'Terminé ✅';
      } else {
        const remain = (totalBefore(currentIdx) + blocks[currentIdx].dur*60) - elapsed;
        document.getElementById('ppCurrent').textContent = blocks[currentIdx].name + ' — ' + Math.ceil(remain/60) + ' min restantes';
      }
    }

    document.getElementById('ppStart').addEventListener('click', function() {
      running = !running;
      this.textContent = running ? '⏸ Pause' : '▶ Reprendre';
      if (running) interval = setInterval(() => { elapsed++; update(); }, 1000);
      else clearInterval(interval);
    });
    document.getElementById('ppNext').addEventListener('click', function() {
      elapsed = totalBefore(currentIdx + 1);
      update();
    });
    document.getElementById('ppReset').addEventListener('click', function() {
      clearInterval(interval); running = false; elapsed = 0; currentIdx = 0;
      document.getElementById('ppStart').textContent = '▶ Démarrer';
      update();
    });
    document.getElementById('ppToggle').addEventListener('click', function() {
      const body = document.getElementById('ppBody');
      const isHidden = body.style.display === 'none';
      body.style.display = isHidden ? 'block' : 'none';
      this.textContent = isHidden ? '—' : '+';
    });

    renderList();
    update();
  }

  let chatHistory = [];

  function appendChatMsg(msg) {
    chatHistory.push(msg);
    renderOneChatMsg(msg);
  }

  function renderOneChatMsg(msg) {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'chat-msg';
    const letter = msg.author.replace('@','').charAt(0).toUpperCase();
    const color = avatarColorFor(msg.author);
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    div.innerHTML =
      '<div class="chat-avatar" style="background:' + color + '">' + escHtml(letter) + '</div>' +
      '<div class="chat-body">' +
        '<div class="chat-line1"><span class="author">' + escHtml(msg.author) + '</span><span class="chat-time">' + timeStr + '</span></div>' +
        '<span class="text">' + escHtml(msg.text) + '</span>' +
      '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function restoreChatHistory() {
    chatHistory.forEach(renderOneChatMsg);
  }

  function startViewerCountSimulation() {
    const el = document.getElementById('viewerCount');
    if (!el) return;
    const startTime = Date.now();
    let count = 400 + Math.floor(Math.random() * 16);
    const peak = 488 + Math.floor(Math.random() * 8);

    function updateDisplay() {
      el.textContent = count + ' spectateurs';
    }
    updateDisplay();

    function scheduleNext() {
      const elapsedMin = (Date.now() - startTime) / 60000;
      let delayMs;

      if (elapsedMin < 3) {
        delayMs = 4000 + Math.random() * 6000;
      } else if (elapsedMin < 15) {
        delayMs = 10000 + Math.random() * 20000;
      } else {
        const roll = Math.random();
        if (roll < 0.15) {
          delayMs = (20 + Math.random() * 15) * 60000;
        } else {
          delayMs = 60000 + Math.random() * 180000;
        }
      }

      setTimeout(() => {
        if (elapsedMin < 3) {
          const delta = Math.floor(Math.random() * 9) - 2;
          count = Math.max(370, Math.min(peak + 4, count + delta));
        } else if (elapsedMin < 15) {
          const bias = count < peak ? 1 : 0;
          const delta = Math.floor(Math.random() * 5) - 1 + bias;
          count = Math.max(390, Math.min(peak + 3, count + delta));
        } else {
          const leaveRoll = Math.random();
          if (leaveRoll < 0.35) {
            count = Math.max(380, count - (1 + Math.floor(Math.random() * 4)));
          } else if (leaveRoll < 0.6) {
            count = Math.min(peak + 3, count + (1 + Math.floor(Math.random() * 3)));
          }
        }
        updateDisplay();
        scheduleNext();
      }, delayMs);
    }
    scheduleNext();
  }

  function escHtml(s) { return String(s||'').replace(/</g,'&lt;'); }
</script>
</body>
</html>
