<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinaire en direct</title>
<style>
  :root { --green-deep:#0D1A12; --gold:#B8965A; --cream:#FAF7F1; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family: Arial, sans-serif; background:#fff; }
  .layout { display:flex; height:100vh; width:100vw; }
  .main-col { flex:1; display:flex; flex-direction:column; min-width:0; }
  .video-area { flex:1; position:relative; background:#fff; display:flex; align-items:center; justify-content:center; }
  video { width:100%; height:100%; object-fit:contain; background:#fff; }
  .live-badge { position:absolute; top:16px; left:16px; display:inline-flex; align-items:center; gap:6px; background:#c0392b; color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; z-index:5; }
  .live-dot { width:8px; height:8px; background:#fff; border-radius:50%; animation:pulse 1.4s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .viewer-count { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.6); color:#fff; font-size:12px; font-weight:600; padding:6px 14px; border-radius:20px; z-index:5; }
  .title-bar { background:var(--green-deep); color:var(--cream); padding:16px 20px; border-top:2px solid var(--gold); }
  .title-bar h1 { margin:0; font-size:17px; font-weight:700; }
  .chat-col { width:340px; background:#161f19; border-left:1px solid #2a352d; display:flex; flex-direction:column; }
  .chat-header { padding:14px 16px; color:var(--cream); font-weight:700; font-size:14px; border-bottom:1px solid #2a352d; }
  .chat-messages { flex:1; overflow-y:auto; padding:10px 14px; }
  .chat-msg { margin-bottom:14px; font-size:13px; line-height:1.4; animation:fadein 0.4s; display:flex; gap:8px; }
  @keyframes fadein { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .chat-avatar { width:28px; height:28px; min-width:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:12px; }
  .chat-body { flex:1; min-width:0; }
  .chat-line1 { display:flex; align-items:baseline; gap:6px; margin-bottom:2px; }
  .chat-msg .author { color:var(--gold); font-weight:700; }
  .chat-time { color:#6b756e; font-size:10px; }
  .chat-msg .text { color:var(--cream); word-break:break-word; }
  .unmute-btn { position:absolute; bottom:70px; left:50%; transform:translateX(-50%); padding:10px 20px; border:none; border-radius:24px; background:var(--gold); color:var(--green-deep); font-weight:700; font-size:14px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.3); z-index:5; }
  .sound-control { position:absolute; bottom:20px; left:20px; display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.55); padding:8px 14px; border-radius:24px; z-index:5; }
  .mute-toggle-btn { background:none; border:none; font-size:18px; cursor:pointer; padding:0; line-height:1; }
  .volume-slider { width:90px; cursor:pointer; accent-color:var(--gold); }
  .waiting, .ended { background:var(--cream); border-radius:12px; padding:60px 30px; text-align:center; margin:auto; max-width:520px; }
  .waiting h2, .ended h2 { color:var(--green-deep); margin:0 0 18px; font-size:24px; }
  .subtitle-waiting { color:#666; font-size:14px; margin:6px 0; }
  .start-date { color:var(--green-deep); font-size:19px; font-weight:700; margin:8px 0 20px; text-transform:capitalize; }
  .countdown { font-size:32px; font-weight:700; color:var(--gold); margin:8px 0 20px; }
  .tier-badge { display:inline-block; background:rgba(184,150,90,0.15); color:var(--gold); font-weight:700; font-size:14px; padding:8px 18px; border-radius:20px; margin:10px 0 16px; }
  .loading { color:var(--cream); text-align:center; margin:auto; }
  @media (max-width:800px) { .layout { flex-direction:column; } .chat-col { width:100%; height:220px; } }
</style>
</head>
<body>
<div class="layout" id="layout">
  <div class="loading">Connexion au webinaire…</div>
</div>

<script>
  const CRM_WATCH_API = 'https://n8n.srv936251.hstgr.cloud/webhook/crm-webinar-watch';
  const params = new URLSearchParams(window.location.search);
  const inscriptionId = params.get('id');
  let reportInterval = null;

  const CHAT_SCRIPT = [
    { at: 15, author: '@sarah.b', text: 'Bonsoir tout le monde 👋' },
    { at: 35, author: 'karim_m92', text: "j'ai hâte d'apprendre tout ça" },
    { at: 60, author: 'NadiaT', text: 'coucou de Genève 🇨🇭' },
    { at: 90, author: 'yassine.k7', text: 'Enfin quelqu\'un qui explique clairement 🔥' },
    { at: 130, author: '@malika_88', text: '🔥🔥🔥' },
    { at: 175, author: 'omarbenali', text: "C'est exactement ce que je cherchais" },
    { at: 230, author: 'amalfr23', text: 'Merci pour ce partage ❤️' },
    { at: 290, author: '@rachid.dz', text: 'Je note tout ça 📝' },
    { at: 340, author: 'imane_1990', text: "Wow je n'y avais jamais pensé comme ça" },
    { at: 400, author: 'sofianeK', text: '👏👏👏' },
    { at: 460, author: '@sara.belhaj', text: 'Ça confirme ce que je vivais depuis des années' },
    { at: 530, author: 'adil.tanger', text: 'On peut avoir le lien du bonus ? 🙏' },
    { at: 600, author: 'HindOu', text: 'Incroyable, merci beaucoup !' },
    { at: 670, author: '@bilal_2024', text: 'Est-ce que ça marche aussi pour mon cas ?' },
    { at: 740, author: 'fatima.zh', text: "J'ai déjà commencé à appliquer ça 🔥" },
    { at: 810, author: 'hassan99', text: 'Génial cette masterclass 🙏🙏' },
    { at: 880, author: '@leila_c', text: 'Je partage à ma sœur tout de suite' },
    { at: 950, author: 'youssef.b', text: '💯💯💯' },
    { at: 1020, author: 'NoraLyon', text: 'ça change tout ce que je pensais' },
    { at: 1100, author: '@karim.essaidi', text: 'Merci infiniment 🙏' },
    { at: 1200, author: 'siham_92', text: 'trop bien expliqué' },
    { at: 1300, author: 'medaminee', text: '🔥🔥🔥🔥' },
    { at: 1400, author: '@nawal.b', text: 'je suis scotchée' },
    { at: 1500, author: 'othmane77', text: "Enfin une vraie méthode qui marche" },
    { at: 1650, author: 'aicha_k', text: '👍👍' },
    { at: 1800, author: '@driss.ma', text: 'ça vaut vraiment le detour ce live' },
    { at: 1950, author: 'salma2000', text: 'j\'attends la suite avec impatience' },
    { at: 2100, author: 'ilyas_official', text: '🙌🙌' },
    { at: 2300, author: '@houda.b', text: 'top niveau franchement' },
    { at: 2500, author: 'reda_ma', text: 'On sent l\'expérience derrière' },
    { at: 2700, author: 'yasmina77', text: '🔥' },
    { at: 2900, author: '@anass.k', text: 'exactement mon problème depuis 2 ans' },
    { at: 3100, author: 'chaimaa_m', text: 'merci du fond du coeur ❤️' },
    { at: 3300, author: 'hamza.rt', text: '💪💪' },
    { at: 3500, author: '@meriem_z', text: 'trop hâte de commencer' },
    { at: 3800, author: 'soufiane99', text: 'clair et net, merci' }
  ];
  const AVATAR_COLORS = ['#B8965A','#5A8C5A','#8C5A5A','#5A7A8C','#8C7A5A','#6E5A8C','#5A8C7A','#8C5A7A'];
  function avatarColorFor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }
  let shownCount = 0;

  if (!inscriptionId) {
    document.getElementById('layout').innerHTML = '<div class="ended"><h2>Lien invalide.</h2></div>';
  } else {
    loadInfo();
  }

  async function loadInfo() {
    try {
      const resp = await fetch(CRM_WATCH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'info', inscription_id: inscriptionId })
      });
      const data = await resp.json();
      if (!data.success) {
        document.getElementById('layout').innerHTML = '<div class="ended"><h2>' + (data.message || 'Webinaire introuvable.') + '</h2></div>';
        return;
      }
      render(data);
    } catch (err) {
      document.getElementById('layout').innerHTML = '<div class="ended"><h2>Erreur de connexion.</h2></div>';
    }
  }

  function render(data) {
    if (data.statut === 'en_attente') {
      renderWaiting(data);
    } else if (data.statut === 'termine') {
      renderEnded(data);
    } else {
      renderPlayer(data);
    }
  }

  function renderWaiting(data) {
    const secs = data.secondes_avant_debut;
    const startDate = new Date(data.heure_debut.replace(' ', 'T') + 'Z');
    const now = new Date();
    const isSameDay = startDate.getUTCFullYear() === now.getUTCFullYear() && startDate.getUTCMonth() === now.getUTCMonth() && startDate.getUTCDate() === now.getUTCDate();

    let tier;
    if (secs <= 3600) tier = 'urgent';
    else if (isSameDay) tier = 'today';
    else tier = 'far';

    let html = '<div class="waiting">' +
      '<h2>Bienvenue' + (data.nom ? ', ' + escHtml(data.nom.split(' ')[0]) : '') + ' 👋</h2>' +
      '<div class="subtitle-waiting">Ton webinaire "' + escHtml(data.titre) + '" commence le :</div>' +
      '<div class="start-date">' + formatStartDate(data.heure_debut) + '</div>';

    if (tier === 'urgent') {
      html += '<div class="countdown" id="cd"></div>' +
              '<div class="subtitle-waiting">Reste sur cette page, la lecture démarrera automatiquement.</div>';
    } else if (tier === 'today') {
      html += '<div class="tier-badge">📅 C\'est aujourd\'hui !</div>' +
              '<div class="subtitle-waiting">Reviens sur ce lien à l\'heure indiquée pour rejoindre le direct.</div>';
    } else {
      html += '<div class="subtitle-waiting">Note bien la date — reviens sur ce lien à l\'heure indiquée pour rejoindre le direct.</div>';
    }
    html += '</div>';
    document.getElementById('layout').innerHTML = html;

    if (tier !== 'urgent') return;

    let remaining = secs;
    const cdEl = document.getElementById('cd');
    function tick() {
      if (remaining <= 0) { loadInfo(); return; }
      const h = Math.floor(remaining/3600), m = Math.floor((remaining%3600)/60), s = remaining%60;
      let txt = '';
      if (h > 0) txt += h + 'h ';
      txt += String(m).padStart(2,'0') + 'min ' + String(s).padStart(2,'0') + 's';
      cdEl.textContent = txt;
      remaining--;
      setTimeout(tick, 1000);
    }
    tick();
  }

  function formatStartDate(heureDebutStr) {
    const d = new Date(heureDebutStr.replace(' ', 'T') + 'Z');
    const jours = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
    const mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    const jourNom = jours[d.getUTCDay()];
    const jourNum = d.getUTCDate();
    const moisNom = mois[d.getUTCMonth()];
    const heures = String(d.getUTCHours()).padStart(2,'0');
    const minutes = String(d.getUTCMinutes()).padStart(2,'0');
    return jourNom + ' ' + jourNum + ' ' + moisNom + ' à ' + heures + 'h' + minutes;
  }

  function renderEnded(data) {
    document.getElementById('layout').innerHTML = '<div class="ended"><h2>Ce webinaire est terminé</h2><div>Une nouvelle session commence bientôt — reviens vérifier plus tard.</div></div>';
  }

  function renderPlayer(data) {
    const layout = document.getElementById('layout');
    layout.innerHTML =
      '<div class="main-col">' +
        '<div class="video-area">' +
          '<div class="live-badge"><span class="live-dot"></span> EN DIRECT</div>' +
          '<div class="viewer-count" id="viewerCount">' + (data.spectateurs_actuels || 1) + ' spectateurs</div>' +
          '<video id="videoPlayer" autoplay muted playsinline oncontextmenu="return false" controlsList="nodownload noremoteplayback nofullscreen"></video>' +
          '<div class="sound-control" id="soundControl">' +
            '<button id="muteToggle" class="mute-toggle-btn">🔇</button>' +
            '<input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">' +
          '</div>' +
        '</div>' +
        '<div class="title-bar"><h1>' + escHtml(data.titre) + '</h1></div>' +
      '</div>' +
      '<div class="chat-col">' +
        '<div class="chat-header">💬 Discussion en direct</div>' +
        '<div class="chat-messages" id="chatMessages"></div>' +
      '</div>';

    const video = document.getElementById('videoPlayer');
    video.src = data.video_url;
    video.addEventListener('loadedmetadata', () => {
      video.currentTime = data.position_secondes;
      video.play().catch(() => {});
    });

    const muteToggle = document.getElementById('muteToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    video.volume = 0.8;

    muteToggle.addEventListener('click', function() {
      video.muted = !video.muted;
      muteToggle.textContent = video.muted ? '🔇' : '🔊';
    });

    volumeSlider.addEventListener('input', function() {
      video.volume = this.value / 100;
      if (this.value > 0 && video.muted) { video.muted = false; muteToggle.textContent = '🔊'; }
      if (this.value == 0) { video.muted = true; muteToggle.textContent = '🔇'; }
    });

    catchUpChat(data.position_secondes);
    setInterval(() => checkChat(video.currentTime), 1000);
    startViewerCountSimulation();

    reportInterval = setInterval(() => {
      if (!video.paused) {
        fetch(CRM_WATCH_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'progress', inscription_id: inscriptionId, position_secondes: Math.floor(video.currentTime) })
        }).catch(() => {});
      }
    }, 15000);
  }

  function catchUpChat(currentPos) {
    while (shownCount < CHAT_SCRIPT.length && CHAT_SCRIPT[shownCount].at <= currentPos) {
      appendChatMsg(CHAT_SCRIPT[shownCount]);
      shownCount++;
    }
  }

  function checkChat(currentPos) {
    if (shownCount < CHAT_SCRIPT.length && CHAT_SCRIPT[shownCount].at <= currentPos) {
      appendChatMsg(CHAT_SCRIPT[shownCount]);
      shownCount++;
    }
  }

  function appendChatMsg(msg) {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'chat-msg';
    const letter = msg.author.replace('@','').charAt(0).toUpperCase();
    const color = avatarColorFor(msg.author);
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    div.innerHTML =
      '<div class="chat-avatar" style="background:' + color + '">' + escHtml(letter) + '</div>' +
      '<div class="chat-body">' +
        '<div class="chat-line1"><span class="author">' + escHtml(msg.author) + '</span><span class="chat-time">' + timeStr + '</span></div>' +
        '<span class="text">' + escHtml(msg.text) + '</span>' +
      '</div>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function startViewerCountSimulation() {
    const el = document.getElementById('viewerCount');
    if (!el) return;
    const startTime = Date.now();
    let count = 400 + Math.floor(Math.random() * 16);
    const peak = 488 + Math.floor(Math.random() * 8);

    function updateDisplay() {
      el.textContent = count + ' spectateurs';
    }
    updateDisplay();

    function scheduleNext() {
      const elapsedMin = (Date.now() - startTime) / 60000;
      let delayMs;

      if (elapsedMin < 3) {
        delayMs = 4000 + Math.random() * 6000;
      } else if (elapsedMin < 15) {
        delayMs = 10000 + Math.random() * 20000;
      } else {
        const roll = Math.random();
        if (roll < 0.15) {
          delayMs = (20 + Math.random() * 15) * 60000;
        } else {
          delayMs = 60000 + Math.random() * 180000;
        }
      }

      setTimeout(() => {
        if (elapsedMin < 3) {
          const delta = Math.floor(Math.random() * 9) - 2;
          count = Math.max(370, Math.min(peak + 4, count + delta));
        } else if (elapsedMin < 15) {
          const bias = count < peak ? 1 : 0;
          const delta = Math.floor(Math.random() * 5) - 1 + bias;
          count = Math.max(390, Math.min(peak + 3, count + delta));
        } else {
          const leaveRoll = Math.random();
          if (leaveRoll < 0.35) {
            count = Math.max(380, count - (1 + Math.floor(Math.random() * 4)));
          } else if (leaveRoll < 0.6) {
            count = Math.min(peak + 3, count + (1 + Math.floor(Math.random() * 3)));
          }
        }
        updateDisplay();
        scheduleNext();
      }, delayMs);
    }
    scheduleNext();
  }

  function escHtml(s) { return String(s||'').replace(/</g,'&lt;'); }
</script>
</body>
</html>
